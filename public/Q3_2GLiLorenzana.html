<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2Q Portfolio">
    <meta name="keywords" content="2Q, Portfolio, Projects, Web Development">
    <meta name="author" content="Abigail Lorenzana">
    <link rel="stylesheet" href="style2.css">
    <link rel="icon" href="../asset/primogem.png" sizes="100x100" type="image/png"> 
    <script src="script.js" defer></script>

</head>

<body>
    
<form onsubmit="return saveSignup()"
      onreset="return confirmReset()">

<fieldset>
<label>
    Student ID:
    <input type="number" id="studentID" required onblur="checkEmpty('studentID')">
</label>
<br/><br/>
<label>
    Full Name:
    <input type="text" id="fullName" required onblur="checkEmpty('fullName')">
</label>
<br/><br/>
<label>
    Birthday:
    <input type="date" id="birthday" required onblur="checkEmpty('birthday')">
</label>
<br/><br/>
<label>
    Email Address:
    <input type="email" id="email" required onblur="checkEmpty('email')">
</label>
<br/><br/>

<label>
    Mobile Phone:
    <input type="text" id="mobilePhone" required onblur="checkEmpty('mobilePhone')">
</label>
<br/><br/>

<label>
    Grade Level:
    <select id="gradeLevel" name="gradeLevel" required>
        <option value="Grade 7">Grade 7</option>
        <option value="Grade 8">Grade 8</option>
        <option value="Grade 9">Grade 9</option>
        <option value="Grade 10">Grade 10</option>
        <option value="Grade 11">Grade 11</option>
        <option value="Grade 12">Grade 12</option>
    </select>
</label>
<br/><br/>

<label>Intern/Extern:</label><br>
    <label class="radio-label">
        <input type="radio" name="status" value="intern" required>
            Intern
    </label>
    <br>
    <label class="radio-label">
            <input type="radio" name="status" value="extern" required>
            Extern
    </label>
    <br><br>
    </label>

<label>
    Preferred Organization/Club:<br/>
    <select id="orgclub" name="orgclub" required>
        <option value="AstroSoc">AstroSoc</option>
        <option value="Likha">Likha</option>
        <option value="Math Club">Math Club</option>
        <option value="Bake Club">Bake Club</option>
        <option value="Lagablab">Lagablab</option>
        <option value="The Science Scholar">The Science Scholar</option>
        <option value="Solace">Solace</option>
    </select>
</label><br/><br/>

<label>
    Why do you want to join?
    <textarea id="reason" name="reason" rows="4" cols="40" required>
    </textarea>
</label>
    </fieldset><br/>

    <input type="submit" value="Submit">
    <input type="reset" value="Reset">

    <button type="button" onclick="window.location.href='viewSignUps.html'">
    View Signups
    </button>

    </form>

    <footer>
        <hr/>
            <p>Copyright <span>&copy; Abigail Lorenzana</span></p>
    </footer>
</body>
</html>
